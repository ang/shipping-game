<!DOCTYPE html>
<html>
    <head>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style>
        body {
          font-family: monospace;
          font-size: 1rem;
          background-color: white;
        }

        @media (max-width: 768px) {
          font-size: 2rem;

          button {
            font-size: 2rem;
          }
        }


        #ships {
          margin-bottom: 1rem;
        }

        #gameInfo {
          margin-bottom: 1rem;
        }

        #shipsInfo {
          display: flex;
          flex-wrap: wrap;
        }

        .shipInfo {
          margin-right: 1rem;
          margin-bottom: 1rem;
          border-style: double;
          padding: 10px;

          & button {
            display: block;
            margin-top: 0.2rem;
          }
        }

        button:disabled {
          background-color: #ccc; /* Light grey background */
          color: #666; /* Dark grey text */
          cursor: not-allowed;
          opacity: 0.6;
        }

        button {
          font-size: 1rem;
        }

        #deployShips {
          & button {
            display: block;
            margin-bottom: 0.2rem;
          }
        }

        #planetsInfo {
          display: flex;
          flex-wrap: wrap;
        }

        .planetInfo {
          margin-right: 1rem;
          margin-bottom: 1rem;
          border-style: double;
          padding: 10px;

          & button {
            display: block;
            margin-top: 0.2rem;
          }
        }

        .planetDisplay {
          white-space: pre;
          margin-bottom: 0.2rem;
        }

        .miningDisplay {
          margin-top: 1rem;
        }

        #resetGame {
          margin-top: 0.2rem;
        }
      </style>
    </head>
    <body>
      <div id="ships"></div>
      <div id="gameInfo"></div>
      <div id="shipsInfo"></div>
      <div id="planetsInfo"></div>
      <!-- <button id="debugNextButton"></button> -->
      <script type="module" src="./src/game.ts"></script>
      <div>Ascii art from <a href="https://www.asciiart.eu/space/planets">https://www.asciiart.eu/space/planets</a>.  Special shoutout to "jgs" and "JT" for their ascii art.</div>
      <button id="resetGame">Reset Game</button>
    </body>
</html>
