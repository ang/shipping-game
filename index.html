<!DOCTYPE html>
<html>
    <head>
      <style>
        body { font-family: monospace; }

        #ships {
          margin-bottom: 1rem;
        }

        #gameInfo {
          margin-bottom: 1rem;
        }

        #shipsInfo {
          display: flex;
          flex-wrap: wrap;
        }

        .shipInfo {
          margin-right: 1rem;
          margin-bottom: 1rem;
          border-style: double;
          padding: 10px;

          & button {
            display: block;
            margin-top: 0.2rem;
          }
        }

        button:disabled {
          background-color: #ccc; /* Light grey background */
          color: #666; /* Dark grey text */
          cursor: not-allowed;
          opacity: 0.6;
        }

        #deployShips {
          & button {
            display: block;
            margin-bottom: 0.2rem;
          }
        }

        #planetsInfo {
          display: flex;
          flex-wrap: wrap;
        }

        .planetInfo {
          margin-right: 1rem;
          margin-bottom: 1rem;
          border-style: double;
          padding: 10px;

          & button {
            display: block;
            margin-top: 0.2rem;
          }
        }

        .planetDisplay {
          white-space: pre;
          margin-bottom: 0.2rem;
        }
      </style>
      <script type="module" crossorigin src="https://ang.github.io/shipping-game/assets/index-B_TCGth7.js"></script>
    </head>
    <body>
      <div id="ships"></div>
      <div id="gameInfo"></div>
      <div id="shipsInfo"></div>
      <div id="planetsInfo"></div>
      <!-- <button id="debugNextButton"></button> -->
      <div>Ascii art from <a href="https://www.asciiart.eu/space/planets">https://www.asciiart.eu/space/planets</a>.  Special shoutout to "jgs" and "JT" for their ascii art.</div>
    </body>
</html>
